<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Case Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work tool for a fast-paced case agent: scan, click, paste
   IDEA a colour-tabbed agent binder: every case type has its own colour and emoji
   PICTURE the template cards themselves, colour-coded by case type
   COLOUR white ground, near-black ink; teal insertion, amber DSPC, pink read, violet multi, slate no-replacement, blue email
   TYPE Inter (fallback Segoe UI): bold 15-20px titles, 12.5px note text, Arial 14 emails
   LAYOUT sticky bar with tabs + search; MiniMed in 3 scenario columns; GSE as a priority stack then a 2-column grid */
:root{color-scheme:light;
  --bg:#ffffff;--ink:#14161b;--muted:#646b7a;--line:#e5e7ec;--soft:#f5f6f8;
  --ok:#15803d;--ok-t:#e9f8ef;--bad:#c2261d;--bad-t:#fdecea;
  --mm:#1d4ed8;--mm-t:#eaf0ff}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:13px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* category colours */
.c-ins{--c:#0f766e;--t:#e3f5f2;--b:#a7ddd5}
.c-dspc{--c:#b45309;--t:#fff2df;--b:#f6cf98}
.c-read{--c:#be185d;--t:#fde9f2;--b:#f5b5d0}
.c-multi{--c:#6d28d9;--t:#f0eafe;--b:#cdb8f8}
.c-no{--c:#475569;--t:#eef2f6;--b:#cbd3dd}
.c-subj{--c:#3730a3;--t:#ecedff;--b:#c3c6f5}
.c-mail{--c:#1d4ed8;--t:#e8f0fe;--b:#b9cdf8}
.c-ai{--c:#52525b;--t:#f3f3f5;--b:#d6d6dc}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:10px max(20px,2vw);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:#3b404c}
.tab:hover{border-color:#c8ccd5;background:var(--soft)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.mm{color:var(--mm);border-color:#c7d5fb;background:var(--mm-t)}
.tab.mm:hover{border-color:var(--mm)}
.tab.mm[aria-selected=true]{background:var(--mm);border-color:var(--mm);color:#fff}
.tab.empty{opacity:.5;font-weight:600}
.tab .soon{font-size:11px;font-weight:600}
.tab kbd{font:600 10px/1 Inter,system-ui,sans-serif;padding:3px 5px;border-radius:4px;background:rgba(0,0,0,.07);color:inherit;opacity:.75}
.tab[aria-selected=true] kbd{background:rgba(255,255,255,.2)}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center}
.search span{position:absolute;left:11px;font-size:14px;pointer-events:none}
.search input{width:200px;height:40px;border-radius:10px;border:1.5px solid var(--line);padding:0 34px 0 34px;font-size:14px;background:#fff}
.search input:focus{outline:none;border-color:var(--mm);box-shadow:0 0 0 3px var(--mm-t)}
.search kbd{position:absolute;right:9px;font:600 11px/1 Inter,system-ui,sans-serif;padding:3px 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:#fff;pointer-events:none}
.last{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;background:var(--soft);font-size:12px;color:var(--muted);white-space:nowrap;max-width:250px}
.last b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.last.fresh{background:var(--ok-t);color:var(--ok)}
.last.fresh b{color:var(--ok)}

/* flags */
.flag{display:inline-block;width:21px;height:14px;flex:none;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.flag svg{display:block;width:100%;height:100%}

/* layout */
main{max-width:1280px;margin:0 auto;padding:6px max(20px,2vw) 70px}
.sec{display:flex;align-items:center;gap:10px;margin:30px 0 12px;font-size:20px;font-weight:800;letter-spacing:-.015em}
.sec .count{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:999px}
.sub{margin:18px 0 9px;font-size:14px;font-weight:800;color:#3b404c;display:flex;align-items:center;gap:7px}
.stack{display:grid;gap:12px}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.cols{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.col{display:grid;gap:10px}
.colhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--t);color:var(--c);font-weight:800;font-size:17px;letter-spacing:-.01em;border:1.5px solid var(--b)}
.colhead .pill{font-size:12px}
@media(max-width:1000px){.cols,.grid3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.top{position:static}.grid2{grid-template-columns:minmax(0,1fr)}.search input{width:100%}.search{flex:1}.tools{width:100%;margin-left:0}.last{display:none}}

/* country chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.chip small{color:var(--muted);font-size:12px;font-weight:500}
.chip:hover{border-color:#c8ccd5;background:var(--soft)}
.chip[aria-pressed=true]{border-color:var(--mm);background:var(--mm-t);color:var(--mm)}
.chip[aria-pressed=true] small{color:var(--mm)}
.current{display:flex;align-items:center;gap:10px;margin:20px 0 14px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.current .flag{width:33px;height:22px}
.current small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}

/* cards */
.card{border:1.5px solid var(--b);border-radius:12px;background:#fff;overflow:hidden;transition:border-color .12s,box-shadow .12s,transform .12s}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--c);box-shadow:0 3px 14px rgba(20,22,30,.08)}
.card.click:active{transform:scale(.995)}
.card.copied{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-t)}
.chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--t)}
.ico{font-size:18px;line-height:1}
.ctitle{margin:0;font-size:15px;font-weight:800;color:var(--c);letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:#fff;border:1px solid var(--line);color:#3b404c}
.pill.yes{color:var(--ok);border-color:#bfe6cc;background:var(--ok-t)}
.pill.no{color:var(--bad);border-color:#f5c6c2;background:var(--bad-t)}
.pill.kit{color:#1d4ed8;border-color:#c7d5fb;background:#eef3ff}
.copybtn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:8px;background:#fff;border:1.5px solid var(--b);color:var(--c);white-space:nowrap}
.card.click:hover .copybtn{background:var(--c);border-color:var(--c);color:#fff}
.card.copied .copybtn,.card.copied:hover .copybtn{background:var(--ok);border-color:var(--ok);color:#fff}
.body{margin:0;padding:10px 13px 12px;font:12.5px/1.5 Inter,"Segoe UI",system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;color:#2b2f38}
.card.subject .body{font-weight:700;color:var(--ink);font-size:13px}
.card.email .body{font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#111}
.card.prompt .body{max-height:88px;overflow:hidden;color:var(--muted);font-size:12px;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
.card.prompt.open .body{max-height:none;-webkit-mask-image:none;mask-image:none;color:#2b2f38}
.more{display:block;margin:0 13px 11px;padding:0;border:0;background:none;font-size:12px;font-weight:700;color:var(--mm)}
.more:hover{text-decoration:underline}

/* variant buttons */
.variants{display:flex;flex-wrap:wrap;gap:7px;padding:11px 12px 2px}
.vbtn{min-height:38px;padding:0 13px;border-radius:9px;border:1.5px solid var(--b);background:#fff;color:var(--c);font-size:13px;font-weight:800;transition:background .1s,color .1s}
.vbtn:hover{background:var(--c);border-color:var(--c);color:#fff}
.vbtn.copied,.vbtn.copied:hover{background:var(--ok);border-color:var(--ok);color:#fff}
.preview{display:block;padding:9px 13px 12px;color:var(--muted);font-size:12px}
.preview pre{margin:4px 0 0;font:700 13px/1.45 Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}

.tab:focus-visible,.chip:focus-visible,.card:focus-visible,.vbtn:focus-visible,.more:focus-visible{outline:3px solid var(--mm);outline-offset:2px}
[hidden]{display:none!important}
.empty-state,.nores{margin:70px auto;text-align:center;color:var(--muted);font-size:14px}
.empty-state .big,.nores .big{display:block;font-size:40px;margin-bottom:8px}
.empty-state b,.nores b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.hint{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
.hint kbd{font:600 11px/1 Inter,system-ui,sans-serif;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--soft)}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#14161b;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Template sets"></nav>
    <div class="tools">
      <label class="search"><span>🔎</span><input id="q" type="search" placeholder="Search templates" autocomplete="off" aria-label="Search templates"><kbd>/</kbd></label>
      <div class="last" id="last" title="Last thing you copied">📋 Last copied: <b>nothing yet</b></div>
    </div>
  </div>
</header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
{
"use strict";
const EMAIL_FONT = "Arial, Helvetica, sans-serif";

const YEAR = new Date().getFullYear();

/* =====================================================================
   FLAGS (drawn as SVG so they also show on Windows, which has no flag emoji)
   ===================================================================== */
const svg = (inner, vb) => `<svg viewBox="${vb || "0 0 30 20"}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${inner}</svg>`;
const hbands = (a, b, c) => svg(`<rect width="30" height="20" fill="${a}"/><rect y="6.667" width="30" height="6.667" fill="${b}"/><rect y="13.333" width="30" height="6.667" fill="${c}"/>`);
const vbands = (a, b, c) => svg(`<rect width="30" height="20" fill="${a}"/><rect x="10" width="10" height="20" fill="${b}"/><rect x="20" width="10" height="20" fill="${c}"/>`);
const FLAGS = {
  es: svg(`<rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/>`),
  it: vbands("#009246", "#FFFFFF", "#CE2B37"),
  fr: vbands("#0055A4", "#FFFFFF", "#EF4135"),
  be: vbands("#000000", "#FDDA24", "#EF3340"),
  nl: hbands("#AE1C28", "#FFFFFF", "#21468B"),
  pl: svg(`<rect width="30" height="20" fill="#FFFFFF"/><rect y="10" width="30" height="10" fill="#DC143C"/>`),
  se: svg(`<rect width="30" height="20" fill="#006AA7"/><rect x="9.375" width="3.75" height="20" fill="#FECC00"/><rect y="8" width="30" height="4" fill="#FECC00"/>`),
  fi: svg(`<rect width="30" height="20" fill="#FFFFFF"/><rect x="8.33" width="5" height="20" fill="#003580"/><rect y="7.27" width="30" height="5.46" fill="#003580"/>`),
  no: svg(`<rect width="30" height="20" fill="#BA0C2F"/><rect x="8.18" width="5.46" height="20" fill="#FFFFFF"/><rect y="7.5" width="30" height="5" fill="#FFFFFF"/><rect x="9.545" width="2.73" height="20" fill="#00205B"/><rect y="8.75" width="30" height="2.5" fill="#00205B"/>`),
  ch: svg(`<rect width="30" height="20" fill="#DA291C"/><rect x="13" y="4" width="4" height="12" fill="#FFFFFF"/><rect x="9" y="8" width="12" height="4" fill="#FFFFFF"/>`),

const flag = code => `<span class="flag">${FLAGS[code]}</span>`;



/* =====================================================================
   TEMPLATE TEXT
   L(...) joins lines with ONE BLANK LINE between them (Salesforce layout).
   ===================================================================== */
const L = (...lines) => lines.join("\n\n");

/* ---------------- MiniMed ---------------- */

  { id: "ES-es", flag: "es", country: "Spain", lang: "Spanish",

    yes: `Recibirá su sensor Instinct y el kit de devolución en un plazo de 5 a 7 días.

  { id: "NL-nl", flag: "nl", country: "Netherlands", lang: "Dutch",

  { id: "BE-de", flag: "be", country: "Belgium", lang: "German",

/* ================= storage ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem("ct." + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ct." + k, v); } catch (e) { /* ignore */ } },
};
const state = { tab: store.get("tab", "minimed"), locale: store.get("locale", "ES-es"), q: "" };
if (!TABS.some(t => t.id === state.tab)) state.tab = "minimed";
if (!MM.some(l => l.id === state.locale)) state.locale = "ES-es";

/* ================= copy ================= */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function emailHtml(text) {
  const st = `font-family:${EMAIL_FONT};font-size:${EMAIL_SIZE};`;
  return text.split("\n").map(line =>
    `<div style="${st}margin:0;">` + (line === "" ? "<br>" : `<span style="${st}">${esc(line)}</span>`) + `</div>`
  ).join("");
}

function copyNow(text, html) {
  let handled = false;
  const onCopy = e => {
    e.clipboardData.setData("text/plain", text);
    if (html) e.clipboardData.setData("text/html", html);
    e.preventDefault();
    handled = true;
  };
  const holder = document.createElement("span");
  holder.textContent = "x";
  holder.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
  document.body.appendChild(holder);
  const sel = window.getSelection();
  const saved = sel.rangeCount ? sel.getRangeAt(0) : null;
  const range = document.createRange();
  range.selectNodeContents(holder);
  sel.removeAllRanges(); sel.addRange(range);
  document.addEventListener("copy", onCopy, true);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.removeEventListener("copy", onCopy, true);
  sel.removeAllRanges(); if (saved) sel.addRange(saved);
  holder.remove();
  if (ok && handled) return Promise.resolve(true);
  if (navigator.clipboard) {
    const plain = () => navigator.clipboard.writeText(text).then(() => true, () => false);
    if (html && window.ClipboardItem && navigator.clipboard.write) {
      return navigator.clipboard.write([new ClipboardItem({
        "text/plain": new Blob([text], { type: "text/plain" }),
        "text/html": new Blob([html], { type: "text/html" }),
      })]).then(() => true, plain);
    }
    return plain();
  }
  return Promise.resolve(false);
}

let toastTimer, lastTimer;
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, isErr ? 3500 : 1200);
}
function copied(label) {
  toast("✅ Copied · " + label);
  const last = document.getElementById("last");
  last.querySelector("b").textContent = label;
  last.classList.add("fresh");
  clearTimeout(lastTimer);
  lastTimer = setTimeout(() => last.classList.remove("fresh"), 2500);
}
function selectForManualCopy(pre) {
  const r = document.createRange(); r.selectNodeContents(pre);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  toast("⚠️ Copy was blocked. The text is selected: press Ctrl+C.", true);
}

/* ================= building blocks ================= */
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}
function pillsHtml(pills) {
  return (pills || []).map(p => `<span class="pill ${p[0]}">${esc(p[1])}</span>`).join("");
}
function section(ico, title, count) {
  return el("h2", "sec", `<span>${ico}</span><span>${esc(title)}</span>` + (count ? `<span class="count">${count}</span>` : ""));
}
function sub(ico, title) { return el("h3", "sub", `<span>${ico}</span><span>${esc(title)}</span>`); }

/* card: { title, ico, cat, kind, pills, text | variants, rich, label } */
function card(o) {
  const kind = o.kind || "note";
  const c = el("div", `card ${kind} ${o.cat || "c-no"}`);
  c.dataset.search = (o.title + " " + (o.text || (o.variants || []).map(v => v.label + " " + v.text).join(" "))).toLowerCase();
  const head = el("div", "chead", `<span class="ico">${o.ico || "📄"}</span><h3 class="ctitle">${esc(o.title)}</h3>${pillsHtml(o.pills)}`);
  c.appendChild(head);
  const label = o.label || o.title;

  if (o.variants) {
    const row = el("div", "variants");
    const prev = el("div", "preview", "Click a button to copy it:");
    const pre = el("pre");
    pre.textContent = o.variants[0].text;
    prev.appendChild(pre);
    o.variants.forEach(v => {
      const b = el("button", "vbtn", esc(v.label));
      b.type = "button";
      b.dataset.copy = v.text;
      b.title = v.text;
      b.addEventListener("mouseenter", () => { pre.textContent = v.text; });
      b.addEventListener("focus", () => { pre.textContent = v.text; });
      b.addEventListener("click", () => {
        pre.textContent = v.text;
        copyNow(v.text, o.rich ? emailHtml(v.text) : null).then(ok => {
          if (!ok) return selectForManualCopy(pre);
          b.classList.add("copied");
          clearTimeout(b._t);
          b._t = setTimeout(() => b.classList.remove("copied"), 1200);
          copied(o.title + " · " + v.label);
        });
      });
      row.appendChild(b);
    });
    c.appendChild(row);
    c.appendChild(prev);
    return c;
  }

  const btn = el("span", "copybtn", "📋 Copy");
  head.appendChild(btn);
  const pre = el("pre", "body");
  pre.textContent = o.text;
  c.appendChild(pre);
  c.classList.add("click");
  c.tabIndex = 0;
  c.setAttribute("role", "button");
  c.setAttribute("aria-label", "Copy " + label);
  c.dataset.copy = o.text;
  const doCopy = () => copyNow(o.text, o.rich ? emailHtml(o.text) : null).then(ok => {
    if (!ok) return selectForManualCopy(pre);
    c.classList.add("copied");
    btn.textContent = "✅ Copied";
    clearTimeout(c._t);
    c._t = setTimeout(() => { c.classList.remove("copied"); btn.textContent = "📋 Copy"; }, 1200);
    copied(label);
  });
  c.addEventListener("click", e => { if (!e.target.closest(".more")) doCopy(); });
  c.addEventListener("keydown", e => {
    if (e.target !== c) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doCopy(); }
  });
  if (kind === "prompt") {
    const more = el("button", "more", "▾ Show full prompt");
    more.type = "button";
    more.addEventListener("click", () => {
      const open = c.classList.toggle("open");
      more.textContent = open ? "▴ Hide" : "▾ Show full prompt";
    });
    c.appendChild(more);
  }
  return c;
}
function group(cls, items, defaults) {
  const g = el("div", cls);
  items.forEach(it => g.appendChild(card(Object.assign({}, defaults || {}, it))));
  return g;
}

/* ================= views ================= */
function viewMiniMed(root) {
  root.appendChild(section("🌍", "Country"));
  const chips = el("div", "chips");
  MM.forEach(l => {
    const multi = MM.filter(x => x.country === l.country).length > 1;
    const b = el("button", "chip", flag(l.flag) + `<span>${esc(l.country)}</span>` + (multi ? `<small>${esc(l.lang)}</small>` : ""));
    b.type = "button";
    b.dataset.locale = l.id;
    b.setAttribute("aria-pressed", String(l.id === state.locale));
    b.addEventListener("click", () => { state.locale = l.id; store.set("locale", l.id); render(); });
    chips.appendChild(b);
  });
  root.appendChild(chips);

  const loc = MM.find(l => l.id === state.locale);
  const notes = loc.uk ? MM_NOTE_UK : MM_NOTE;
  root.appendChild(el("div", "current", flag(loc.flag) + `<span>${esc(loc.country)}</span><small>${esc(loc.lang)} · ${esc(loc.id)}</small>`));

  const cols = el("div", "cols");
  [
    { ico: "🩹", head: "Insertion-3", cat: "c-ins", kit: P.noKit, subject: MM_SUBJECT.ins, note: notes.ins, email: loc.no, tag: "Insertion" },
    { ico: "⚠️", head: "DSPC", cat: "c-dspc", kit: P.noKit, subject: MM_SUBJECT.dspc, note: notes.dspcNo, email: loc.no, tag: "DSPC no return" },
    { ico: "⚠️", head: "DSPC", cat: "c-dspc", kit: P.kit, subject: MM_SUBJECT.dspc, note: notes.dspcYes, email: loc.yes, tag: "DSPC return kit" },
  ].forEach(s => {
    const col = el("div", "col");
    col.appendChild(el("div", "colhead " + s.cat, `<span>${s.ico}</span><span>${esc(s.head)}</span>${pillsHtml([s.kit])}`));
    col.appendChild(card({ title: "Subject", ico: "🏷️", cat: "c-subj", kind: "subject", text: s.subject, label: s.tag + " subject" }));
    col.appendChild(card({ title: "Note", ico: "📝", cat: s.cat, kind: "note", text: s.note, label: s.tag + " note" }));
    col.appendChild(card({ title: "Email", ico: "✉️", cat: "c-mail", kind: "email", rich: true, text: s.email, label: s.tag + " email · " + loc.id }));
    cols.appendChild(col);
  });
  root.appendChild(cols);

  root.appendChild(section("🤖", "AI prompts"));
  root.appendChild(group("grid2", [
    { title: "Province prompt", ico: "📍", text: MM_PROMPT_PROVINCE },
    { title: "DSPC prompt", ico: "⚠️", text: MM_PROMPT_DSPC },
  ], { kind: "prompt", cat: "c-ai" }));
}

function viewEmpty(root, tab) {
  root.appendChild(el("div", "empty-state", `<span class="big">🗂️</span><b>${flag(tab.flag)} ${esc(tab.label)}</b>No templates added yet.`));
}
const VIEWS = { minimed: viewMiniMed, fr: viewFrance, es: viewSpain };

/* ================= search ================= */
function applySearch() {
  const q = state.q.trim().toLowerCase();
  const root = document.getElementById("view");
  root.querySelector(".nores")?.remove();
  const cards = [...root.querySelectorAll(".card")];
  if (!cards.length) return;
  let shown = 0;
  cards.forEach(c => {
    const hit = !q || q.split(/\s+/).every(w => c.dataset.search.includes(w));
    c.hidden = !hit;
    if (hit) shown++;
  });
  root.querySelectorAll(".stack,.grid2,.grid3,.col").forEach(g => {
    g.hidden = q !== "" && ![...g.querySelectorAll(".card")].some(c => !c.hidden);
  });
  root.querySelectorAll(".sec,.sub").forEach(h => {
    let n = h.nextElementSibling, any = false;
    while (n && !n.matches(".sec") && !(h.matches(".sub") && n.matches(".sub"))) {
      if (n.matches(".chips,.current")) any = true;
      if (n.querySelector && [...n.querySelectorAll(".card")].some(c => !c.hidden)) any = true;
      if (n.matches(".card") && !n.hidden) any = true;
      n = n.nextElementSibling;
    }
    h.hidden = q !== "" && !any;
  });
  if (q && !shown) root.appendChild(el("div", "nores", `<span class="big">🤷</span><b>No templates match “${esc(state.q.trim())}”</b>Press Esc to clear the search.`));
}

/* ================= render ================= */
function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TABS.forEach(t => {
    const b = el("button", "tab" + (t.cls ? " " + t.cls : "") + (t.empty ? " empty" : ""),
      (t.flag ? flag(t.flag) : "🩵") + `<span>${esc(t.label)}</span>` + (t.empty ? `<span class="soon">soon</span>` : `<kbd>${t.key}</kbd>`));
    b.type = "button";
    b.setAttribute("role", "tab");
    b.dataset.tab = t.id;
    b.setAttribute("aria-selected", String(t.id === state.tab));
    b.addEventListener("click", () => go(t.id));
    nav.appendChild(b);
  });
}
function go(id) { state.tab = id; store.set("tab", id); render(); window.scrollTo(0, 0); }
function render() {
  renderTabs();
  const root = document.getElementById("view");
  root.innerHTML = "";
  const tab = TABS.find(t => t.id === state.tab);
  if (VIEWS[tab.id]) VIEWS[tab.id](root); else viewEmpty(root, tab);
  root.appendChild(el("div", "hint", `Click any card to copy it · <kbd>1</kbd>–<kbd>3</kbd> switch tabs · <kbd>/</kbd> search · <kbd>Esc</kbd> clear`));
  document.title = tab.label + " · Case Templates";
  applySearch();
}

const q = document.getElementById("q");
q.addEventListener("input", () => { state.q = q.value; applySearch(); });
document.addEventListener("keydown", e => {
  const typing = e.target.matches("input,textarea,[contenteditable]");
  if (e.key === "Escape") { q.value = ""; state.q = ""; applySearch(); if (typing) q.blur(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); return; }
  const t = TABS.find(x => x.key === e.key);
  if (t) { e.preventDefault(); go(t.id); }
});

render();
}
