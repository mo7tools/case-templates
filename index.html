<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Case Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE professional work tool for a case agent: scan, click, paste
   IDEA a quiet reference sheet: one colour and one drawn icon per case type
   PICTURE the template cards themselves, dense and aligned
   COLOUR white ground, near-black ink; teal insertion, indigo DSPC, rose read, plum multi, slate no-replacement, blue email
   TYPE Inter (fallback Segoe UI): bold titles, 12px note text, Arial 14 emails
   LAYOUT sticky bar; up to 3 cards per row on wide screens, 2 on medium, 1 on phones */
:root{color-scheme:light;
  --bg:#ffffff;--ink:#16181d;--muted:#667085;--line:#e4e7ec;--soft:#f5f6f8;
  --ok:#15803d;--ok-t:#e9f7ee;--bad:#b42318;--bad-t:#fdeeec;
  --mm:#1d4ed8;--mm-t:#eef3ff;--r:6px}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:12.5px/1.42 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* category colours (no yellow, no orange) */
.c-ins{--c:#0f766e;--t:#eef8f6;--b:#bfe3dd}
.c-dspc{--c:#4338ca;--t:#f0f1fe;--b:#cfd2f7}
.c-read{--c:#be123c;--t:#fdf0f3;--b:#f3c6d1}
.c-multi{--c:#86198f;--t:#faf0fb;--b:#e6c5ea}
.c-no{--c:#475569;--t:#f4f6f8;--b:#d5dbe3}
.c-subj{--c:#3f3f46;--t:#f6f6f7;--b:#dcdce0}
.c-mail{--c:#1d4ed8;--t:#eff4ff;--b:#c5d5fa}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1360px;margin:0 auto;padding:7px max(16px,2vw);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:#344054}
.tab:hover{border-color:#c4c9d2;background:var(--soft)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.mm{color:var(--mm)}
.tab.mm[aria-selected=true]{background:var(--mm);border-color:var(--mm);color:#fff}
.tab[aria-selected=true] .flag{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.tab kbd{font:600 10px/1 Inter,system-ui,sans-serif;padding:3px 5px;border-radius:3px;background:rgba(0,0,0,.06);color:inherit;opacity:.75}
.tab[aria-selected=true] kbd{background:rgba(255,255,255,.2)}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center;color:var(--muted)}
.search .i{position:absolute;left:10px;pointer-events:none}
.search input{width:200px;height:34px;border-radius:var(--r);border:1px solid var(--line);padding:0 30px 0 32px;font-size:13px;background:#fff;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--mm);box-shadow:0 0 0 3px var(--mm-t)}
.search kbd{position:absolute;right:8px;font:600 10px/1 Inter,system-ui,sans-serif;padding:3px 5px;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:#fff;pointer-events:none}
.last{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:var(--r);background:var(--soft);font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:290px}
.last b{color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.last.fresh{background:var(--ok-t);color:var(--ok)}
.last.fresh b{color:var(--ok)}

/* flags */
.flag{display:inline-block;width:20px;height:13px;flex:none;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.flag svg{display:block;width:100%;height:100%}

/* layout */
main{max-width:1360px;margin:0 auto;padding:12px max(16px,2vw) 36px}
.sec{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.sec .i{width:17px;height:17px;color:var(--muted)}
.sec .count{font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);padding:2px 7px;border-radius:4px}
.g3{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.wide{grid-column:1/-1}
.cols{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.col{display:grid;gap:8px}
/* plain column titles: text only, clearly not a button */
.coltitle{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0;padding:0 0 5px;border-bottom:2px solid var(--c);color:var(--c);font-weight:800;font-size:16px;letter-spacing:-.01em;cursor:default}
.coltitle .i{width:17px;height:17px}
@media(max-width:1020px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:800px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(min-width:681px){.card .chead{flex-wrap:nowrap}}
@media(max-width:680px){.g3{grid-template-columns:minmax(0,1fr)}.top{position:static}.search{flex:1}.search input{width:100%}.tools{width:100%;margin-left:0}.last{display:none}}

/* country chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 9px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-weight:600}
.chip small{color:var(--muted);font-size:11px;font-weight:500}
.chip:hover{border-color:#c4c9d2;background:var(--soft)}
.chip[aria-pressed=true]{border-color:var(--mm);background:var(--mm-t);color:var(--mm);box-shadow:inset 0 0 0 1px var(--mm)}
.chip[aria-pressed=true] small{color:var(--mm)}
.current{display:flex;align-items:center;gap:9px;margin:12px 0 10px;font-size:19px;font-weight:800;letter-spacing:-.02em}
.current .flag{width:28px;height:19px}
.current small{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0}

/* cards */
.card{position:relative;border:1px solid var(--b);border-radius:var(--r);background:#fff;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--c);box-shadow:0 1px 6px rgba(16,24,40,.08)}
.card.copied{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-t)}
.chead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 9px;background:var(--t);color:var(--c)}
.pill,.copybtn,.chead>.i{flex:none}
.ctitle{margin:0;min-width:min-content;flex:0 1 auto;font-size:13.5px;font-weight:800;color:var(--c);letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;background:#fff;border:1px solid var(--line);color:#475467}
.pill .i{width:11px;height:11px;stroke-width:2.6}
.pill.yes{color:var(--ok);border-color:#c3e6cf}
.pill.no{color:var(--bad);border-color:#f3c9c4}
.pill.kit{color:var(--mm);border-color:#c5d5fa}
.copybtn{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:4px;background:#fff;border:1px solid var(--b);color:var(--c);white-space:nowrap}
.copybtn .i{width:12px;height:12px}
.card.click:hover .copybtn{background:var(--c);border-color:var(--c);color:#fff}
.card.copied .copybtn,.card.copied:hover .copybtn{background:var(--ok);border-color:var(--ok);color:#fff}
.body{padding:6px 10px 8px;font-size:12px;line-height:1.42;color:#2b2f38;overflow-wrap:anywhere}
.body .gap{height:5px}
.ph{background:#e3e8fb;color:#3538cd;font-weight:800;padding:0 3px;border-radius:3px}
.card.email .body{font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4;color:#111}
.card.email .body .gap{height:9px}
.raw{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;white-space:pre}

/* compact subject card: one line */
.card.subject .ctitle{font-size:11.5px;font-weight:700;color:var(--muted)}
.card.subject .subj{font-weight:800;font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}

/* variant buttons */
.vwrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 9px 8px}
.variants{display:flex;flex-wrap:wrap;gap:5px}
.vbtn{min-height:29px;padding:0 10px;border-radius:4px;border:1px solid var(--b);background:#fff;color:var(--ink);font-size:12px;font-weight:700;transition:background .1s,color .1s}
.vbtn:hover{background:var(--c);border-color:var(--c);color:#fff}
.vbtn.nv{color:var(--bad);border-color:#f3c9c4;background:var(--bad-t)}
.vbtn.nv:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.vbtn.copied,.vbtn.copied:hover{background:var(--ok);border-color:var(--ok);color:#fff}
.preview{flex:1 1 220px;color:var(--muted);font-size:11px}
.preview div{white-space:pre-line;font-weight:700;font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}

.tab:focus-visible,.chip:focus-visible,.card:focus-visible,.vbtn:focus-visible{outline:2px solid var(--mm);outline-offset:2px}
[hidden]{display:none!important}
.nores{margin:50px auto;text-align:center;color:var(--muted);font-size:13px}
.nores b{display:block;color:var(--ink);font-size:16px;margin-bottom:3px}
.hint{margin-top:24px;color:var(--muted);font-size:11.5px;text-align:center}
.hint kbd{font:600 10px/1 Inter,system-ui,sans-serif;padding:2px 5px;border:1px solid var(--line);border-radius:3px;background:var(--soft)}

#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);display:flex;align-items:center;gap:7px;background:#16181d;color:#fff;padding:9px 14px;border-radius:var(--r);font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Template sets"></nav>
    <div class="tools">
      <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Search templates" autocomplete="off" aria-label="Search templates"><kbd>/</kbd></label>
      <div class="last" id="last" title="Last thing you copied"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9.5 5V3.5h5V5M9.5 11h5M9.5 15h5"/></svg><span>Last copied:</span> <b>nothing yet</b></div>
    </div>
  </div>
</header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
{
"use strict";
const EMAIL_FONT = "Arial, Helvetica, sans-serif";
const EMAIL_SIZE = "14px";
const YEAR = new Date().getFullYear();

/* =====================================================================
   FLAGS (drawn as SVG so they also show on Windows, which has no flag emoji)
   ===================================================================== */
const svg = (inner, vb) => `<svg viewBox="${vb || "0 0 30 20"}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${inner}</svg>`;
const hbands = (a, b, c) => svg(`<rect width="30" height="20" fill="${a}"/><rect y="6.667" width="30" height="6.667" fill="${b}"/><rect y="13.333" width="30" height="6.667" fill="${c}"/>`);
const vbands = (a, b, c) => svg(`<rect width="30" height="20" fill="${a}"/><rect x="10" width="10" height="20" fill="${b}"/><rect x="20" width="10" height="20" fill="${c}"/>`);
const FLAGS = {
  es: svg(`<rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/>`),
  it: vbands("#009246", "#FFFFFF", "#CE2B37"),
  fr: vbands("#0055A4", "#FFFFFF", "#EF4135"),
  be: vbands("#000000", "#FDDA24", "#EF3340"),
  nl: hbands("#AE1C28", "#FFFFFF", "#21468B"),
  pl: svg(`<rect width="30" height="20" fill="#FFFFFF"/><rect y="10" width="30" height="10" fill="#DC143C"/>`),
  se: svg(`<rect width="30" height="20" fill="#006AA7"/><rect x="9.375" width="3.75" height="20" fill="#FECC00"/><rect y="8" width="30" height="4" fill="#FECC00"/>`),
  fi: svg(`<rect width="30" height="20" fill="#FFFFFF"/><rect x="8.33" width="5" height="20" fill="#003580"/><rect y="7.27" width="30" height="5.46" fill="#003580"/>`),
  no: svg(`<rect width="30" height="20" fill="#BA0C2F"/><rect x="8.18" width="5.46" height="20" fill="#FFFFFF"/><rect y="7.5" width="30" height="5" fill="#FFFFFF"/><rect x="9.545" width="2.73" height="20" fill="#00205B"/><rect y="8.75" width="30" height="2.5" fill="#00205B"/>`),
  ch: svg(`<rect width="30" height="20" fill="#DA291C"/><rect x="13" y="4" width="4" height="12" fill="#FFFFFF"/><rect x="9" y="8" width="12" height="4" fill="#FFFFFF"/>`),
  gb: svg(`<rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2.4"/><path d="M30,0 V30 M0,15 H60" stroke="#FFFFFF" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>`, "0 0 60 30"),
};
const flag = code => `<span class="flag">${FLAGS[code]}</span>`;


// MiniMed mark: blue flag with a bold white M
FLAGS.mm = svg(`<rect width="30" height="20" fill="#1d4ed8"/><path d="M9.2 15.2V5.4l5.8 6.8 5.8-6.800v9.8" fill="none" stroke="#ffffff" stroke-width="2.9" stroke-linejoin="miter" stroke-linecap="butt"/>`);

/* ================= icons (drawn for this page, one per situation) ================= */
const ICONS = {
  copy: `<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>`,
  check: `<path d="M5 12.5l4.5 4.500L19 7.5"/>`,
  ban: `<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>`,
  box: `<path d="M4 8l8-4.500L20 8v8l-8 4.500L4 16z"/><path d="M4 8l8 4.500L20 8M12 12.500v8"/>`,
  tag: `<path d="M3.5 12.500V5A1.5 1.5 0 0 1 5 3.500h7.500l8 8-9 9z"/><circle cx="8" cy="8" r="1.3"/>`,
  note: `<path d="M6 3.500h8.500L19 8v12.500H6z"/><path d="M14 3.500v5h5M9 13h7M9 16.500h5"/>`,
  mail: `<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7.500l8 6 8-6"/>`,
  ins: `<circle cx="12" cy="7.5" r="4"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/><path d="M12 14.500v6M9 18l3 3 3-3"/>`,
  dspc: `<rect x="5.5" y="3.5" width="13" height="17" rx="2.5"/><path d="M12 8v5"/><circle cx="12" cy="16.3" r="1" fill="currentColor" stroke="none"/>`,
  read: `<path d="M12 3.500c3.2 4 5.5 6.9 5.5 10a5.5 5.5 0 0 1-11 0c0-3.1 2.3-6 5.5-10z"/><path d="M9.5 14a2.5 2.5 0 0 0 2.5 2.5"/>`,
  multi: `<circle cx="7.5" cy="8" r="3.5"/><circle cx="16.5" cy="8" r="3.5"/><circle cx="12" cy="16" r="3.5"/>`,
  cycle: `<path d="M19.5 12a7.5 7.5 0 0 1-13.2 4.900M4.5 12a7.5 7.5 0 0 1 13.2-4.9"/><path d="M17.9 3.500v3.800h-3.800M6.1 20.500v-3.800h3.8"/>`,
  home: `<path d="M4 11l8-7 8 7"/><path d="M6.5 9.500V20h11V9.5"/><path d="M10 20v-5h4v5"/>`,
  barcode: `<path d="M5 6v12M8.5 6v12M12 6v8M15.5 6v12M19 6v12"/>`,
  twice: `<rect x="4" y="4" width="11" height="11" rx="2"/><rect x="9" y="9" width="11" height="11" rx="2"/>`,
  stop: `<path d="M8.5 3.500h7l5 5v7l-5 5h-7l-5-5v-7z"/><path d="M8.5 12h7"/>`,
  clock: `<circle cx="12" cy="12" r="8.5"/><path d="M12 7.500V12l3 2"/>`,
  xcircle: `<circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/>`,
  users: `<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.500c.4-3.2 2.6-5 5.5-5s5.1 1.8 5.5 5"/><circle cx="16.8" cy="9.5" r="2.5"/><path d="M16.5 14.600c2.3.2 3.7 1.7 4 4.4"/>`,
  cross: `<path d="M9.5 4h5v5.500H20v5h-5.500V20h-5v-5.500H4v-5h5.500z"/>`,
  globe: `<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.500c2.5 2.6 3.7 5.4 3.7 8.500s-1.2 5.9-3.7 8.500c-2.5-2.6-3.7-5.4-3.7-8.500s1.2-5.9 3.7-8.500z"/>`,
  shield: `<path d="M12 3.500l7 2.500v5.500c0 4.3-2.8 7.4-7 9-4.2-1.6-7-4.7-7-9V6z"/><path d="M12 8.500v4"/><circle cx="12" cy="15.5" r="1" fill="currentColor" stroke="none"/>`,
  hospital: `<rect x="4.5" y="4.5" width="15" height="16" rx="1.5"/><path d="M12 8v5M9.5 10.500h5M10 20.500v-3.500h4v3.5"/>`,
  heart: `<path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 7.5 4.2 4.2 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>`,
  building: `<path d="M5 20.500v-16h9v16M14 9.500h5v11M3.5 20.500h17"/><path d="M8 8h3M8 11.500h3M8 15h3"/>`,
  idcard: `<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><circle cx="8.7" cy="11" r="2"/><path d="M5.8 15.500c.5-1.4 1.5-2 2.9-2s2.4.6 2.9 2M14 10h4M14 13.500h4"/>`,
  pin: `<path d="M12 21s-6.5-5.6-6.5-10.500a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/>`,
};
const icon = name => {
  if (!ICONS[name]) throw new Error("Missing icon: " + name);
  return `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
};

/* =====================================================================
   TEMPLATE TEXT
   L(...) joins lines with ONE BLANK LINE between them (Salesforce layout).
   Every note follows: complaint, order number, action, email, then TSG (DSPC / Read).
   XXX marks something to fill in after pasting.
   ===================================================================== */
const L = (...lines) => lines.join("\n\n");

/* ---------------- MiniMed ---------------- */
const MM_SUBJECT = { ins: "MiniMed | GSE | INSERTION-3", dspc: "MiniMed | GSE | DSPC" };
const MM_TSG = 'TSG: ALL "UNK" ANSWERS ARE DUE TO INFORMATION MISSING FROM THE WEB FORM';
const MM_TSG_UK = "All UNK-API TSG answers are due to information missing from the web form.";

const MM_NOTE = {
  ins: L("My sensor fell off during wear or use",
         "ORDER NUMBER: XXX",
         "ACTION: REPLACED THE SENSOR WITHOUT SENDING A RETURN KIT",
         "CONFIRMATION EMAIL SENT"),
  dspcNo: L("I see an error message",
            "ORDER NUMBER: XXX",
            "ACTION: REPLACED THE SENSOR WITHOUT SENDING A RETURN KIT",
            "CONFIRMATION EMAIL SENT",
            MM_TSG),
  dspcYes: L("I see an error message",
             "ORDER NUMBER: XXX",
             "ACTION: REPLACED THE SENSOR AND SENT A RETURN KIT",
             "CONFIRMATION EMAIL SENT",
             MM_TSG),
  already: L("ACTION: DID NOT REPLACE THE SENSOR BECAUSE IT WAS ALREADY REPLACED IN CASE XXX",
             "EMAIL SENT TO INFORM THE CUSTOMER"),
  address: L("ACTION: DID NOT REPLACE THE SENSOR BECAUSE THE ADDRESS IS INCORRECT OR INVALID",
             "EMAIL SENT TO B2B TO REQUEST A VALID ADDRESS"),
  canary: L("ACTION: DID NOT REPLACE THE SENSOR BECAUSE THE CUSTOMER LIVES IN THE CANARY ISLANDS AND THE DNI IS NEEDED TO PROCESS THE REPLACEMENT ORDER",

/* ================= copy ================= */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function emailHtml(text) {
  const st = `font-family:${EMAIL_FONT};font-size:${EMAIL_SIZE};`;
  return text.split("\n").map(line =>
    `<div style="${st}margin:0;">` + (line === "" ? "<br>" : `<span style="${st}">${esc(line)}</span>`) + `</div>`
  ).join("");
}

function copyNow(text, html) {
  let handled = false;
  const onCopy = e => {
    e.clipboardData.setData("text/plain", text);
    if (html) e.clipboardData.setData("text/html", html);
    e.preventDefault();
    handled = true;
  };
  const holder = document.createElement("span");
  holder.textContent = "x";
  holder.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
  document.body.appendChild(holder);
  const sel = window.getSelection();
  const saved = sel.rangeCount ? sel.getRangeAt(0) : null;
  const range = document.createRange();
  range.selectNodeContents(holder);
  sel.removeAllRanges(); sel.addRange(range);
  document.addEventListener("copy", onCopy, true);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.removeEventListener("copy", onCopy, true);
  sel.removeAllRanges(); if (saved) sel.addRange(saved);
  holder.remove();
  if (ok && handled) return Promise.resolve(true);
  if (navigator.clipboard) {
    const plain = () => navigator.clipboard.writeText(text).then(() => true, () => false);
    if (html && window.ClipboardItem && navigator.clipboard.write) {
      return navigator.clipboard.write([new ClipboardItem({
        "text/plain": new Blob([text], { type: "text/plain" }),
        "text/html": new Blob([html], { type: "text/html" }),
      })]).then(() => true, plain);
    }
    return plain();
  }
  return Promise.resolve(false);
}

let toastTimer, lastTimer;
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.innerHTML = (isErr ? "" : icon("check")) + `<span>${esc(msg)}</span>`;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, isErr ? 3500 : 1200);
}
function copied(label) {
  toast("Copied · " + label);
  const last = document.getElementById("last");
  last.querySelector("b").textContent = label;
  last.classList.add("fresh");
  clearTimeout(lastTimer);
  lastTimer = setTimeout(() => last.classList.remove("fresh"), 2500);
}
// last resort if the browser blocks copying: select the exact text so Ctrl+C works
function selectForManualCopy(node) {
  const r = document.createRange(); r.selectNodeContents(node);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  toast("Copy was blocked. The text is selected: press Ctrl+C.", true);
}

/* ================= building blocks ================= */
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}
function pillsHtml(keys) {
  return (keys || []).map(k => { const p = PILLS[k]; return `<span class="pill ${p[0]}">${icon(p[1])}${esc(p[2])}</span>`; }).join("");
}
function section(ico, title, count) {
  return el("h2", "sec", icon(ico) + `<span>${esc(title)}</span>` + (count ? `<span class="count">${count}</span>` : ""));
}
// On screen, blank lines show as small gaps and XXX is highlighted; the copied text is the plain original.
function bodyEl(text) {
  const d = el("div", "body");
  text.split("\n").forEach(line => {
    if (line === "") d.appendChild(el("div", "gap"));
    else d.appendChild(el("div", "ln", esc(line).replace(/XXX/g, '<span class="ph">XXX</span>')));
  });
  return d;
}
function rawEl(text) { const r = el("pre", "raw"); r.textContent = text; r.setAttribute("aria-hidden", "true"); return r; }
const COPY_HTML = icon("copy") + "<span>Copy</span>";
const COPIED_HTML = icon("check") + "<span>Copied</span>";

/* card: { title, ico, cat, kind, pills, text | variants, rich, label, wide } */
function card(o) {
  const kind = o.kind || "note";
  const c = el("div", `card ${kind} ${o.cat || "c-no"}` + (o.wide ? " wide" : ""));
  c.dataset.search = (o.title + " " + (o.text || (o.variants || []).map(v => v.label + " " + v.text).join(" "))).toLowerCase();
  const head = el("div", "chead", icon(o.ico || "note") + `<h3 class="ctitle">${esc(o.title)}</h3>${pillsHtml(o.pills)}`);
  c.appendChild(head);
  const label = o.label || o.title;

  if (o.variants) {
    const wrap = el("div", "vwrap");
    const row = el("div", "variants");
    const prev = el("div", "preview", "Hover to preview · click to copy");
    const pv = el("div");
    const show = t => { pv.textContent = t.replace(/\n\n/g, "\n"); };
    show(o.variants[0].text);
    prev.appendChild(pv);
    o.variants.forEach(v => {
      const b = el("button", "vbtn" + (v.nv ? " nv" : ""), esc(v.label));
      b.type = "button";
      b.dataset.copy = v.text;
      b.title = v.text;
      b.addEventListener("mouseenter", () => show(v.text));
      b.addEventListener("focus", () => show(v.text));
      b.addEventListener("click", () => {
        show(v.text);
        copyNow(v.text, null).then(ok => {
          if (!ok) return selectForManualCopy(pv);
          b.classList.add("copied");
          clearTimeout(b._t);
          b._t = setTimeout(() => b.classList.remove("copied"), 1200);
          copied(o.title + " · " + v.label);
        });
      });
      row.appendChild(b);
    });
    wrap.appendChild(row);
    wrap.appendChild(prev);
    c.appendChild(wrap);
    return c;
  }

  const btn = el("span", "copybtn", COPY_HTML);
  const raw = rawEl(o.text);
  if (kind === "subject") {
    const s = el("span", "subj"); s.textContent = o.text;
    head.appendChild(s);
    head.appendChild(btn);
  } else {
    head.appendChild(btn);
    c.appendChild(bodyEl(o.text));
  }
  c.appendChild(raw);
  c.classList.add("click");
  c.tabIndex = 0;
  c.setAttribute("role", "button");
  c.setAttribute("aria-label", "Copy " + label);
  c.dataset.copy = o.text;
  const doCopy = () => copyNow(o.text, o.rich ? emailHtml(o.text) : null).then(ok => {
    if (!ok) return selectForManualCopy(raw);
    c.classList.add("copied");
    btn.innerHTML = COPIED_HTML;
    clearTimeout(c._t);
    c._t = setTimeout(() => { c.classList.remove("copied"); btn.innerHTML = COPY_HTML; }, 1200);
    copied(label);
  });
  c.addEventListener("click", doCopy);
  c.addEventListener("keydown", e => {
    if (e.target !== c) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doCopy(); }
  });
  return c;
}
function grid(items, defaults) {
  const g = el("div", "g3");
  items.forEach(it => g.appendChild(card(Object.assign({}, defaults || {}, it))));
  return g;
}
const noDefaults = { cat: "c-no", pills: ["noReplace"] };

/* ================= views ================= */
function viewMiniMed(root) {
  const chips = el("div", "chips");
  MM.forEach(l => {
    const multi = MM.filter(x => x.country === l.country).length > 1;
    const b = el("button", "chip", flag(l.flag) + `<span>${esc(l.country)}</span>` + (multi ? `<small>${esc(l.lang)}</small>` : ""));
    b.type = "button";
    b.dataset.locale = l.id;
    b.setAttribute("aria-pressed", String(l.id === state.locale));
    b.addEventListener("click", () => { state.locale = l.id; store.set("locale", l.id); render(); });
    chips.appendChild(b);
  });
  root.appendChild(chips);

  const loc = MM.find(l => l.id === state.locale);
  const notes = loc.uk ? MM_NOTE_UK : MM_NOTE;
  root.appendChild(el("div", "current", flag(loc.flag) + `<span>${esc(loc.country)}</span><small>${esc(loc.lang)} · ${esc(loc.id)}</small>`));

  const cols = el("div", "cols");
  [
    { ico: "ins", head: "Insertion-3", cat: "c-ins", kit: "noKit", subject: MM_SUBJECT.ins, note: notes.ins, email: loc.no, tag: "Insertion" },
    { ico: "dspc", head: "DSPC", cat: "c-dspc", kit: "noKit", subject: MM_SUBJECT.dspc, note: notes.dspcNo, email: loc.no, tag: "DSPC no return" },
    { ico: "dspc", head: "DSPC", cat: "c-dspc", kit: "kit", subject: MM_SUBJECT.dspc, note: notes.dspcYes, email: loc.yes, tag: "DSPC return kit" },
  ].forEach(s => {
    const col = el("div", "col");
    col.appendChild(el("h3", "coltitle " + s.cat, icon(s.ico) + `<span>${esc(s.head)}</span>${pillsHtml([s.kit])}`));
    col.appendChild(card({ title: "Subject", ico: "tag", cat: "c-subj", kind: "subject", text: s.subject, label: s.tag + " subject" }));
    col.appendChild(card({ title: "Note", ico: "note", cat: s.cat, kind: "note", text: s.note, label: s.tag + " note" }));
    col.appendChild(card({ title: "Email", ico: "mail", cat: "c-mail", kind: "email", rich: true, text: s.email, label: s.tag + " email · " + loc.id }));
    cols.appendChild(col);
  });
  root.appendChild(cols);

  const no = [
    { title: "Already replaced", ico: "cycle", text: notes.already },
    { title: "Address incorrect or invalid", ico: "pin", text: notes.address },
  ];
  if (loc.id === "ES-es") no.push({ title: "Canary Islands · DNI needed", ico: "idcard", text: MM_NOTE.canary });
  root.appendChild(section("ban", "No replacement", no.length));
  root.appendChild(grid(no, noDefaults));
}

function viewFrance(root) {
  root.appendChild(grid([FR_TOP_SUBJECTS].concat(FR_PRIORITY_NOTES)));
  root.appendChild(section("ban", "No replacement", FR_NO.length));
  root.appendChild(grid([FR_NO_SUBJECTS].concat(FR_NO.map(n => Object.assign({}, noDefaults, n)))));
}

function viewSpain(root) {
  root.appendChild(grid(ES_PRIORITY));
  root.appendChild(section("ban", "No replacement", ES_NO.length));
  root.appendChild(grid(ES_NO, noDefaults));
  root.appendChild(section("mail", "Email"));
  root.appendChild(grid([{ title: "Hospital email", ico: "hospital", cat: "c-mail", kind: "email", rich: true, text: ES_EMAIL_HOSPITAL }]));
}
const VIEWS = { minimed: viewMiniMed, fr: viewFrance, es: viewSpain };

/* ================= search ================= */
function applySearch() {
  const q = state.q.trim().toLowerCase();
  const root = document.getElementById("view");
  root.querySelector(".nores")?.remove();
  let shown = 0;
  root.querySelectorAll(".card").forEach(c => {
    const hit = !q || q.split(/\s+/).every(w => c.dataset.search.includes(w));
    c.hidden = !hit;
    if (hit) shown++;
  });
  root.querySelectorAll(".g3,.col").forEach(g => {
    g.hidden = q !== "" && ![...g.querySelectorAll(".card")].some(c => !c.hidden);
  });
  root.querySelectorAll(".sec").forEach(h => {
    const n = h.nextElementSibling;
    h.hidden = q !== "" && !(n && [...n.querySelectorAll(".card")].some(c => !c.hidden));
  });
  if (q && !shown) root.appendChild(el("div", "nores", `<b>No templates match “${esc(state.q.trim())}”</b>Press Esc to clear the search.`));
}

/* ================= render ================= */
function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TABS.forEach(t => {
    const b = el("button", "tab" + (t.cls ? " " + t.cls : ""), flag(t.flag) + `<span>${esc(t.label)}</span><kbd>${t.key}</kbd>`);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.dataset.tab = t.id;
    b.setAttribute("aria-selected", String(t.id === state.tab));
    b.addEventListener("click", () => go(t.id));
    nav.appendChild(b);
  });
}
function go(id) { state.tab = id; store.set("tab", id); render(); window.scrollTo(0, 0); }
function render() {
  renderTabs();
  const root = document.getElementById("view");
  root.innerHTML = "";
  const tab = TABS.find(t => t.id === state.tab);
  VIEWS[tab.id](root);
  root.appendChild(el("div", "hint", `Click any card to copy it · <kbd>1</kbd>–<kbd>3</kbd> switch tabs · <kbd>/</kbd> search · <kbd>Esc</kbd> clear`));
  document.title = tab.label + " · Case Templates";
  applySearch();
}

const q = document.getElementById("q");
q.addEventListener("input", () => { state.q = q.value; applySearch(); });
document.addEventListener("keydown", e => {
  const typing = e.target.matches("input,textarea,[contenteditable]");
  if (e.key === "Escape") { q.value = ""; state.q = ""; applySearch(); if (typing) q.blur(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); return; }
  const t = TABS.find(x => x.key === e.key);
  if (t) { e.preventDefault(); go(t.id); }
});

render();
}
</script>
</body>
